<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JSON to Key.json</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}
button {
    padding: 14px 24px;
    font-size: 16px;
    background: #22c55e;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
button:hover {
    background: #16a34a;
}
</style>
</head>
<body>

<button onclick="downloadJson()">Download Key.json</button>

<script>
async function downloadJson() {
    const JSON_URL = "https://ad-2.free.nf/ad-2/databatalol.json"; // 🔴 PUT YOUR JSON URL HERE

    try {
        const response = await fetch(JSON_URL);
        if (!response.ok) throw new Error("Failed to fetch JSON");

        const jsonText = await response.text(); // keep exact content

        const blob = new Blob([jsonText], { type: "application/json" });
        const link = document.createElement("a");

        link.href = URL.createObjectURL(blob);
        link.download = "Key.json";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        URL.revokeObjectURL(link.href);
    } catch (err) {
        alert("Error: " + err.message);
    }
}
</script>

</body>
</html>
