<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🔥 Firebase Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #020617;
  color: #e5e7eb;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 16px;
}

.card {
  background: #0f172a;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 20px;
}

h1, h2 {
  margin: 0 0 10px;
}

.item {
  background: #020617;
  padding: 12px;
  border-radius: 10px;
  margin-top: 12px;
}

textarea {
  width: 100%;
  min-height: 120px;
  background: #020617;
  color: #e5e7eb;
  border: 1px solid #1e293b;
  border-radius: 8px;
  padding: 10px;
  font-family: monospace;
  font-size: 13px;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
  flex-wrap: wrap;
}

button {
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 13px;
}

.save {
  background: #22c55e;
  color: #022c22;
}

.delete {
  background: #ef4444;
  color: #450a0a;
}

.key {
  color: #38bdf8;
  font-size: 13px;
}

@media (max-width: 600px) {
  textarea {
    font-size: 12px;
  }
}
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <h1>🔥 Firebase Admin Panel</h1>
    <p style="opacity:.6">Edit Firestore data directly</p>
  </div>

  <div id="firebaseData"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyA9ZJ4D0GZPk-wGwsGpyBd13TUA-9otUb4",
  authDomain: "anant-emote-web.firebaseapp.com",
  databaseURL: "https://anant-emote-web-default-rtdb.firebaseio.com",
  projectId: "anant-emote-web",
  storageBucket: "anant-emote-web.firebasestorage.app",
  messagingSenderId: "1098932634558",
  appId: "1:1098932634558:web:9e1d0446e0258124526fef"
};

/* ================= INIT ================= */
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const firebaseData = document.getElementById("firebaseData");

/* ================= COLLECTIONS ================= */
const COLLECTIONS = [
  "servers",
  "categories",
  "emotes",
  "settings"
];

/* ================= LOAD DATA ================= */
async function loadFirebaseData() {
  firebaseData.innerHTML = "";

  for (const colName of COLLECTIONS) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h2>📁 ${colName}</h2>`;
    firebaseData.appendChild(card);

    try {
      const snap = await getDocs(collection(db, colName));

      if (snap.empty) {
        card.innerHTML += `<p style="opacity:.6">No data</p>`;
        continue;
      }

      snap.forEach(d => {
        const item = document.createElement("div");
        item.className = "item";

        item.innerHTML = `
          <div class="key">Document ID: ${d.id}</div>
          <textarea id="${colName}-${d.id}">
${JSON.stringify(d.data(), null, 2)}
          </textarea>

          <div class="actions">
            <button class="save">💾 Save</button>
            <button class="delete">🗑 Delete</button>
          </div>
        `;

        const textarea = item.querySelector("textarea");
        const saveBtn = item.querySelector(".save");
        const deleteBtn = item.querySelector(".delete");

        /* SAVE */
        saveBtn.onclick = async () => {
          try {
            const newData = JSON.parse(textarea.value);
            await updateDoc(doc(db, colName, d.id), newData);
            alert("✅ Updated successfully");
          } catch (err) {
            alert("❌ Invalid JSON or update failed");
            console.error(err);
          }
        };

        /* DELETE */
        deleteBtn.onclick = async () => {
          if (!confirm("Delete this document?")) return;
          await deleteDoc(doc(db, colName, d.id));
          item.remove();
        };

        card.appendChild(item);
      });

    } catch (err) {
      card.innerHTML += `<p style="color:#ef4444">Error loading</p>`;
      console.error(err);
    }
  }
}

/* ================= RUN ================= */
loadFirebaseData();
console.log("🔥 Editable Firebase Admin Loaded");
</script>
</body>
</html>
