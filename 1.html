<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NOVRA X – Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#020617;
  --card:#0f172a;
  --accent:#38bdf8;
  --danger:#ef4444;
  --gray:#94a3b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:var(--bg);
  color:#e5e7eb;
}
.container{max-width:1200px;margin:auto;padding:20px}
.card{
  background:var(--card);
  padding:16px;
  border-radius:14px;
  margin-bottom:20px;
}
h1,h2,h3{margin:0 0 10px}
input,select,textarea,button{
  width:100%;
  padding:10px;
  margin-top:6px;
  background:#020617;
  border:1px solid #1e293b;
  color:#fff;
  border-radius:8px;
}
button{
  background:var(--accent);
  border:none;
  font-weight:600;
  cursor:pointer;
}
button.danger{background:var(--danger)}
.admin-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#020617;
  padding:12px;
  border-radius:10px;
  margin-top:10px;
}
.admin-item-actions button{
  width:auto;
  padding:6px 10px;
  margin-left:6px;
}
.no-data{color:var(--gray)}
.db-col{
  background:#020617;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
}
.db-doc{
  background:#020617;
  padding:8px;
  border-radius:8px;
  margin-top:8px;
  font-size:12px;
}
.db-doc pre{
  white-space:pre-wrap;
  font-size:11px;
}
</style>
</head>

<body>

<div class="container">

<h1>🔥 NOVRA X Admin Panel</h1>

<!-- SERVERS -->
<div class="card">
<h2>🖥 Servers</h2>
<form id="serverForm">
<input id="serverName" placeholder="Server Name">
<input id="serverUrl" placeholder="Base URL">
<select id="serverRegion">
<option value="">Select Region</option>
<option value="indian">Indian</option>
<option value="bangladesh">Bangladesh</option>
<option value="other">Other</option>
</select>
<button>Add Server</button>
</form>
<div id="serverList"></div>
</div>

<!-- CATEGORIES -->
<div class="card">
<h2>📂 Categories</h2>
<form id="categoryForm">
<input id="categoryName" placeholder="Category Name">
<input id="categoryIcon" placeholder="Icon (🔥)">
<button>Add Category</button>
</form>
<div id="categoryList"></div>
</div>

<!-- EMOTES -->
<div class="card">
<h2>😀 Emotes</h2>
<form id="emoteForm">
<input id="emoteImageUrl" placeholder="Image URL">
<select id="emoteCategory"></select>
<button>Add Emote</button>
</form>
<div id="emoteList"></div>
</div>

<!-- SETTINGS -->
<div class="card">
<h2>⚙ Settings</h2>
<input id="telegramUrl" placeholder="Telegram">
<input id="githubUrl" placeholder="GitHub">
<input id="discordUrl" placeholder="Discord">
<input id="youtubeUrl" placeholder="YouTube">
<button id="saveLinks">Save Links</button>
</div>

<!-- DATABASE VIEW -->
<div class="card">
<h2>🗂 Saved Firestore Data</h2>
<div id="dbExplorer"></div>
</div>

</div>

<!-- ================= JS ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc, deleteDoc, doc, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA9ZJ4D0GZPk-wGwsGpyBd13TUA-9otUb4",
  authDomain: "anant-emote-web.firebaseapp.com",
  projectId: "anant-emote-web",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* LOAD SERVERS */
async function loadServers(){
  serverList.innerHTML="";
  const snap=await getDocs(collection(db,"servers"));
  if(snap.empty){serverList.innerHTML="<p class='no-data'>No servers</p>";return;}
  snap.forEach(d=>{
    serverList.innerHTML+=`
    <div class="admin-item">
      <strong>${d.data().name}</strong>
      <button class="danger" onclick="deleteServer('${d.id}')">✖</button>
    </div>`;
  });
}
window.deleteServer=async id=>{
  await deleteDoc(doc(db,"servers",id));
  loadAll();
};

/* LOAD CATEGORIES */
async function loadCategories(){
  categoryList.innerHTML="";
  emoteCategory.innerHTML="";
  const snap=await getDocs(collection(db,"categories"));
  snap.forEach(d=>{
    categoryList.innerHTML+=`<div class="admin-item">${d.data().name}</div>`;
    emoteCategory.innerHTML+=`<option value="${d.id}">${d.data().name}</option>`;
  });
}

/* LOAD EMOTES */
async function loadEmotes(){
  emoteList.innerHTML="";
  const snap=await getDocs(collection(db,"emotes"));
  snap.forEach(d=>{
    emoteList.innerHTML+=`<div class="admin-item">${d.data().emoteId || d.id}</div>`;
  });
}

/* LOAD SETTINGS */
async function loadSettings(){
  const s=await getDoc(doc(db,"settings","footerLinks"));
  if(s.exists()){
    telegramUrl.value=s.data().telegram||"";
    githubUrl.value=s.data().github||"";
    discordUrl.value=s.data().discord||"";
    youtubeUrl.value=s.data().youtube||"";
  }
}

/* DATABASE VIEW */
async function loadDatabaseExplorer(){
  dbExplorer.innerHTML="";
  const collections=["servers","categories","emotes","settings"];
  for(const c of collections){
    const snap=await getDocs(collection(db,c));
    dbExplorer.innerHTML+=`<div class="db-col"><h3>${c}</h3></div>`;
    snap.forEach(d=>{
      dbExplorer.innerHTML+=`
      <div class="db-doc">
        <strong>${d.id}</strong>
        <pre>${JSON.stringify(d.data(),null,2)}</pre>
      </div>`;
    });
  }
}

/* FORMS */
serverForm.onsubmit=async e=>{
  e.preventDefault();
  await addDoc(collection(db,"servers"),{
    name:serverName.value,
    baseUrl:serverUrl.value,
    region:serverRegion.value
  });
  serverForm.reset();
  loadAll();
};

categoryForm.onsubmit=async e=>{
  e.preventDefault();
  await addDoc(collection(db,"categories"),{
    name:categoryName.value,
    icon:categoryIcon.value
  });
  categoryForm.reset();
  loadAll();
};

emoteForm.onsubmit=async e=>{
  e.preventDefault();
  await addDoc(collection(db,"emotes"),{
    image:emoteImageUrl.value,
    category:emoteCategory.value
  });
  emoteForm.reset();
  loadAll();
};

saveLinks.onclick=async()=>{
  await setDoc(doc(db,"settings","footerLinks"),{
    telegram:telegramUrl.value,
    github:githubUrl.value,
    discord:discordUrl.value,
    youtube:youtubeUrl.value
  });
  alert("Saved");
};

/* INIT */
async function loadAll(){
  await loadServers();
  await loadCategories();
  await loadEmotes();
  await loadSettings();
  await loadDatabaseExplorer();
}
loadAll();
</script>

</body>
</html>
